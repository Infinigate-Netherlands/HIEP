name: Deploy HIEP Portal

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the portal; requires separate publication authorization'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Project Updates
        shell: pwsh
        run: |
          Import-Module ./src/HIEP.Tools/HIEP.Tools.psd1 -Force

          $isValid = Test-HIEPProjectUpdate -Path .

          if (-not $isValid) {
              throw 'HIEP Project Update validation failed.'
          }

      - name: Generate project timeline
        shell: pwsh
        run: |
          Import-Module ./src/HIEP.Tools/HIEP.Tools.psd1 -Force

          New-HIEPProjectTimeline `
              -Path . `
              -OutputPath 'portal/data/timeline.json'

          if (-not (Test-Path 'portal/data/timeline.json')) {
              throw 'Timeline generation failed.'
          }

  package:
    name: Prepare explicitly requested Pages artifact
    # A job-level guard also excludes upload-action preparation from normal CI.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Generate project timeline
        shell: pwsh
        run: |
          Import-Module ./src/HIEP.Tools/HIEP.Tools.psd1 -Force

          New-HIEPProjectTimeline `
              -Path . `
              -OutputPath 'portal/data/timeline.json'

          if (-not (Test-Path 'portal/data/timeline.json')) {
              throw 'Timeline generation failed.'
          }

      - name: Upload portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal

  deploy:
    name: Deploy GitHub Pages
    # Technical opt-in only: validation and this input do not grant clearance.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.package.result == 'success' }}
    needs: [build, package]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

